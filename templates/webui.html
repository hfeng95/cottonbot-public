<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cottonbot control panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cotton-orange': '#f7724a',
                        'cotton-dark': '#343638',
                        'cotton-bg': '#111',
                    }
                }
            }
        }
    </script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-3edrmyuQ0w65f8gfBsqowzjJe2iM6n0nKciPUp8y+7E=" crossorigin="anonymous"></script>
</head>
<body class="bg-cotton-dark min-h-screen pb-[250px] overflow-y-scroll">
    <h1 class="font-sans text-center mt-12 mb-1 text-cotton-orange text-4xl font-bold">cottonbot console</h1>

    <form action="/run_cotton" method="post" id="params-form">
        <div id="bodypanel" class="w-4/5 sm:w-3/5 md:w-2/5 min-w-[200px] mx-auto mb-0.5 text-center bg-cotton-orange rounded-lg py-2.5 px-5 font-sans text-base">
            <div class="flex items-center justify-center gap-4 w-full mt-2 mb-2">
                <div class="w-full text-left font-sans text-xs font-bold">Bot Mode</div>
                <select id="in_bot_mode" name="in_bot_mode" class="w-4/5 py-1 px-2 rounded border border-gray-600 bg-gray-800 text-white">
                    <option value="listen">Listening</option>
                    <option value="speak" selected>Speaking</option>
                </select>
            </div>
            
            <div class="flex items-center justify-center gap-4 w-full mt-2 mb-2">
                <div class="w-full text-left font-sans text-xs font-bold">Behavior</div>
                <select id="in_gen_mode" name="in_gen_mode" class="w-4/5 py-1 px-2 rounded border border-gray-600 bg-gray-800 text-white">
                    <option value="command">Command-triggered</option>
                    <option value="auto" selected>Auto-response</option>
                </select>
            </div>

            <label for="in_r_author" class="mx-auto text-center bg-cotton-orange rounded-lg py-2.5 px-5 font-sans text-xs font-bold">Author</label>
            <input type="text" id="in_r_author" name="in_r_author" placeholder="e.g. shakespeare" class="w-full mt-2 mb-2 box-border rounded border border-gray-600 bg-gray-800 text-white py-2.5 px-2.5 font-bold placeholder-cotton-orange">

            <div class="flex items-center justify-center gap-4 w-full mt-2 mb-2">
                <div class="w-full text-left font-sans text-xs font-bold">Adaptive Generation</div>
                <input type="checkbox" id="in_adaptive" name="in_adaptive" {% if settings.adaptive %}checked{% endif %} class="ml-2">
            </div>

            <div class="flex items-center justify-center gap-4 w-full mt-2 mb-2">
                <div class="w-full text-left font-sans text-xs font-bold">Temperature</div>
                <input type="number" id="in_temperature" name="in_temperature" step="0.1" min="0" max="2" value="{{ settings.temperature or 0.7 }}" class="w-4/5 py-1 px-2 rounded border border-gray-600 bg-gray-800 text-white">
            </div>

            <div class="flex items-center justify-center gap-4 w-full mt-2 mb-2">
                <div class="w-full text-left font-sans text-xs font-bold">TTS Enabled (Global Default)</div>
                <input type="checkbox" id="in_tts_enabled" name="in_tts_enabled" {% if settings.tts_enabled %}checked{% endif %} class="ml-2">
            </div>

            <div class="flex items-center justify-center gap-4 w-full mt-2 mb-2">
                <div class="w-full text-left font-sans text-xs font-bold">Moderation Enabled (Global Default)</div>
                <input type="checkbox" id="in_modder_enabled" name="in_modder_enabled" {% if settings.modder_enabled %}checked{% endif %} class="ml-2">
            </div>
        </div>
        
        <div id="server-settings-panel" class="w-4/5 sm:w-3/5 md:w-2/5 min-w-[200px] mx-auto mb-0.5 text-center bg-cotton-orange rounded-lg py-2.5 px-5 font-sans text-base">
            <h2 class="text-center text-cotton-dark mt-0 mb-2 text-xl font-bold">Per-Server Settings</h2>
            <p class="text-center text-cotton-dark text-xs mt-0 mb-4">Configure TTS and Moderation settings for each server</p>
            
            <div class="mb-4 flex items-center gap-2">
                <input type="text" id="new-server-id" placeholder="Enter Server ID to add" class="w-3/5 py-2 px-2 rounded border border-gray-600 bg-gray-800 text-white font-bold placeholder-cotton-orange">
                <button type="button" id="add-server-btn" class="bg-cotton-orange border-none rounded-lg py-2 px-4 text-center font-sans font-bold text-base text-cotton-dark cursor-pointer hover:bg-orange-200 transition-colors duration-300 min-w-[100px]">Add Server</button>
            </div>
            
            <div class="flex gap-2 mb-2.5">
                <button type="button" id="refresh-server-settings" class="bg-cotton-orange border-none rounded-lg py-2.5 px-5 text-center font-sans font-bold text-base text-cotton-dark cursor-pointer hover:bg-orange-200 transition-colors duration-300 min-w-[150px]">Refresh Settings</button>
                <button type="button" id="save-server-settings" class="bg-cotton-orange border-none rounded-lg py-2.5 px-5 text-center font-sans font-bold text-base text-cotton-dark cursor-pointer hover:bg-orange-200 transition-colors duration-300 min-w-[150px]">Save All Settings</button>
            </div>
            
            <div id="server-settings-list" class="max-h-[400px] overflow-y-auto bg-gray-800 rounded-lg p-2.5 mt-2.5">
                <p class="text-white text-center">Loading server settings...</p>
            </div>
        </div>
        <div class="text-center">
            <button class="w-4/5 sm:w-3/5 md:w-2/5 min-w-[200px] mx-auto mb-0.5 bg-cotton-orange border-none rounded-lg py-2.5 px-5 text-center font-sans font-bold text-base text-cotton-dark cursor-pointer hover:bg-orange-200 transition-colors duration-300" type="submit" id="cotton_state_toggle" value="awaken" cotton-state="torun">awaken</button>
        </div>
    </form>

    <div id="status-indicator" class="text-center text-cotton-orange font-sans font-bold my-5 mx-auto w-[90%] max-w-[1200px]">Status: 💤 Asleep</div>

    <hr id="console-divider" class="border-2 border-cotton-orange m-0 w-full fixed bottom-[250px] left-0 z-[100]">
    <div id="console-log-panel" class="fixed bottom-0 left-0 right-0 w-full max-w-full bg-cotton-bg rounded-none shadow-[0_-2px_10px_rgba(0,0,0,0.5)] z-[100]">
        <div id="console-log-header" class="bg-cotton-orange text-cotton-dark py-2 px-4 rounded-none font-bold text-center font-sans border-t-2 border-cotton-orange">
            Console Log
        </div>
        <div id="console-log" class="bg-cotton-bg text-left text-green-500 font-mono p-4 h-[200px] overflow-y-auto rounded-none">
            [System] Awaiting command...
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            console.log("DOM ready");
            const pf = document.getElementById("params-form");
            const tb = document.getElementById("cotton_state_toggle");
            const logBox = document.getElementById("console-log");
            const statusText = document.getElementById("status-indicator");

            console.log({pf, tb, logBox, statusText}); // must show DOM nodes, not null

            if (!pf || !tb) {
                console.error("Missing form/button elements — check IDs and duplicates.");
                return;
            }

            function logMessage(msg){
                const time = new Date().toLocaleTimeString();
                if (logBox) { logBox.innerHTML += `<br>[${time}] ${msg}`; logBox.scrollTop = logBox.scrollHeight; }
                else console.log(msg);
            }

            tb.addEventListener("click", async (e) => {
                e.preventDefault();
                if (tb.getAttribute("cotton-state") === "torun") {
                    console.log("Attempting /run_cotton");
                    try {
                        const formData = new URLSearchParams();
                        formData.append("in_bot_mode", document.getElementById("in_bot_mode").value || "");
                        formData.append("in_gen_mode", document.getElementById("in_gen_mode").value || "");
                        formData.append("in_r_author", document.getElementById("in_r_author").value || "");
                        formData.append("in_adaptive", document.getElementById("in_adaptive").checked ? "true" : "false");
                        formData.append("in_temperature", document.getElementById("in_temperature").value || "");
                        formData.append("in_tts_enabled", document.getElementById("in_tts_enabled").checked ? "true" : "false");
                        formData.append("in_modder_enabled", document.getElementById("in_modder_enabled").checked ? "true" : "false");
                        const res = await fetch("/run_cotton", { method: "POST", body: formData });
                        const j = await res.json();
                        logMessage("Awaken response: " + JSON.stringify(j));
                        tb.innerText = "slumber";
                        tb.setAttribute("cotton-state", "tonap");
                        if (statusText) { statusText.textContent = "Status: 🌙 Awake"; }
                    } catch (err) {
                        console.error(err);
                        logMessage("Awaken failed: " + err);
                    }
                } else {
                    console.log("Attempting /close_cotton");
                    try {
                        const res = await fetch("/close_cotton", { method: "POST" });
                        const j = await res.json();
                        logMessage("Close response: " + JSON.stringify(j));
                        tb.innerText = "awaken";
                        tb.setAttribute("cotton-state", "torun");
                        if (statusText) { statusText.textContent = "Status: 💤 Asleep"; }
                    } catch (err) {
                        console.error(err);
                        logMessage("Close failed: " + err);
                    }
                }
            });

            // Per-Server Settings Management
            const serverSettingsList = document.getElementById("server-settings-list");
            const refreshBtn = document.getElementById("refresh-server-settings");
            const saveBtn = document.getElementById("save-server-settings");
            const addServerBtn = document.getElementById("add-server-btn");
            const newServerIdInput = document.getElementById("new-server-id");
            let serverSettings = {};

            async function loadServerSettings() {
                try {
                    serverSettingsList.innerHTML = "<p class='text-white text-center'>Loading server settings...</p>";
                    const res = await fetch("/api/server-settings");
                    const data = await res.json();
                    
                    if (data.status === "error") {
                        serverSettingsList.innerHTML = `<p class='text-red-500 text-center'>${data.message}</p>`;
                        return;
                    }

                    serverSettings = data.server_settings || {};
                    renderServerSettings();
                } catch (err) {
                    console.error("Failed to load server settings:", err);
                    serverSettingsList.innerHTML = `<p class='text-red-500 text-center'>Error loading settings: ${err.message}</p>`;
                }
            }

            function renderServerSettings() {
                if (Object.keys(serverSettings).length === 0) {
                    serverSettingsList.innerHTML = "<p class='text-white text-center'>No server settings configured. Add a server ID above.</p>";
                    return;
                }

                let html = "";
                for (const [serverId, settings] of Object.entries(serverSettings)) {
                    const ttsEnabled = settings.tts_enabled !== undefined ? settings.tts_enabled : true;
                    const modderEnabled = settings.modder_enabled !== undefined ? settings.modder_enabled : true;
                    
                    html += `<div class="server-setting-item bg-cotton-dark p-2.5 mb-2.5 rounded">`;
                    html += `<div class="flex justify-between items-center mb-2.5">`;
                    html += `<strong class="text-white">Server ID: ${serverId}</strong>`;
                    html += `<button type="button" class="remove-server-btn bg-red-600 text-white border-none py-1.5 px-2.5 rounded cursor-pointer hover:bg-red-700 transition-colors" data-server-id="${serverId}">Remove</button>`;
                    html += `</div>`;
                    html += `<div class="flex items-center justify-center gap-4 w-full mb-1.5">`;
                    html += `<div class="w-full text-left font-sans text-xs font-bold text-white">TTS Enabled</div>`;
                    html += `<input type="checkbox" class="server-tts-checkbox ml-2.5" data-server-id="${serverId}" ${ttsEnabled ? "checked" : ""}>`;
                    html += `</div>`;
                    html += `<div class="flex items-center justify-center gap-4 w-full">`;
                    html += `<div class="w-full text-left font-sans text-xs font-bold text-white">Moderation Enabled</div>`;
                    html += `<input type="checkbox" class="server-modder-checkbox ml-2.5" data-server-id="${serverId}" ${modderEnabled ? "checked" : ""}>`;
                    html += `</div>`;
                    html += `</div>`;
                }
                serverSettingsList.innerHTML = html;

                // Add event listeners
                document.querySelectorAll(".server-tts-checkbox").forEach(cb => {
                    cb.addEventListener("change", (e) => {
                        const serverId = e.target.getAttribute("data-server-id");
                        if (!serverSettings[serverId]) {
                            serverSettings[serverId] = {};
                        }
                        serverSettings[serverId].tts_enabled = e.target.checked;
                    });
                });

                document.querySelectorAll(".server-modder-checkbox").forEach(cb => {
                    cb.addEventListener("change", (e) => {
                        const serverId = e.target.getAttribute("data-server-id");
                        if (!serverSettings[serverId]) {
                            serverSettings[serverId] = {};
                        }
                        serverSettings[serverId].modder_enabled = e.target.checked;
                    });
                });

                document.querySelectorAll(".remove-server-btn").forEach(btn => {
                    btn.addEventListener("click", (e) => {
                        const serverId = e.target.getAttribute("data-server-id");
                        delete serverSettings[serverId];
                        renderServerSettings();
                    });
                });
            }

            async function saveServerSettings() {
                try {
                    const res = await fetch("/api/server-settings", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(serverSettings)
                    });
                    const data = await res.json();
                    if (data.status === "ok") {
                        logMessage("Server settings saved successfully");
                        loadServerSettings(); // Reload to get updated data
                    } else {
                        logMessage("Error saving server settings: " + data.message);
                    }
                } catch (err) {
                    console.error("Failed to save server settings:", err);
                    logMessage("Error saving server settings: " + err.message);
                }
            }

            addServerBtn.addEventListener("click", () => {
                const serverId = newServerIdInput.value.trim();
                if (!serverId) {
                    alert("Please enter a server ID");
                    return;
                }
                
                if (!serverSettings[serverId]) {
                    serverSettings[serverId] = {
                        tts_enabled: true,
                        modder_enabled: true
                    };
                    renderServerSettings();
                    newServerIdInput.value = "";
                } else {
                    alert("Server already exists in settings");
                }
            });

            refreshBtn.addEventListener("click", loadServerSettings);
            saveBtn.addEventListener("click", saveServerSettings);

            // Load server settings on page load
            loadServerSettings();
        });
    </script>
</body>
</html>
